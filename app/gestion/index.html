<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gestion · CLOCA Tennis</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" href="../icon-192.png">
<meta name="theme-color" content="#102f4a">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f5f2ec;--card:#fff;--bd:#e7e1d7;--line:#efe9df;--tx:#12304a;--mut:#5d6b78;--navy:#102f4a;--navy2:#1b3f5f;
  --ac:#b4532a;--ok:#1f6f4a;--ko:#9b2c24;--sun:#fbe3d8;--soft:#f1ece3;--warn:#d9822b;
  --font:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;--disp:'Barlow Condensed','Arial Narrow',sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1923;--card:#16252f;--bd:#26394a;--line:#22323f;--tx:#eef3f7;--mut:#a3b3c0;--soft:#1d2d39;--ac:#d06a3c;--ok:#2f9a68;--ko:#d0553f;--sun:#3a2a20}}
:root[data-theme="dark"]{--bg:#0e1923;--card:#16252f;--bd:#26394a;--line:#22323f;--tx:#eef3f7;--mut:#a3b3c0;--soft:#1d2d39;--ac:#d06a3c;--ok:#2f9a68;--ko:#d0553f;--sun:#3a2a20}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.45 var(--font)}
a{color:var(--ac)}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{margin:0}
.layout{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100vh}
aside{background:var(--navy);color:#fff;padding:18px 12px;position:sticky;top:0;height:100vh;overflow:auto;display:flex;flex-direction:column;gap:4px}
.brand{display:flex;gap:10px;align-items:center;padding:0 8px 14px}
.brand img{width:38px;height:38px;border-radius:50%;background:#fff}
.brand b{font-family:var(--disp);font-size:22px;line-height:1}
.brand span{font-size:11px;color:#c9d6e2;letter-spacing:.8px}
.nav a{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:9px 10px;border-radius:10px;color:#dbe4ec;text-decoration:none;font-weight:500}
.nav a:hover{background:var(--navy2)}
.nav a.on{background:#fff;color:var(--navy);font-weight:600}
.nav .n{background:var(--ac);color:#fff;border-radius:10px;font-size:11px;padding:1px 7px;font-weight:700}
.nav a.rubl{justify-content:flex-start;gap:10px;padding:10px 10px;font-weight:600;color:#e6edf3;margin-top:2px}
.nav a.rubl.on{color:var(--navy);background:#fff}
.nav a.rubl .lbl{flex:1}
.nav a.rubl svg{flex:none;opacity:.85}
.nav .subl{display:flex;flex-direction:column;gap:1px;margin:2px 0 6px 20px;padding-left:10px;border-left:2px solid #2c4e6b}
.nav .subl a{padding:6px 10px;font-size:13px;color:#c9d6e2}
.nav .subl a.on{background:var(--navy2);color:#fff}
.col{min-width:0}
.subnav{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--bd);padding:12px 28px 0;display:flex;flex-direction:column;gap:8px}
.subnav .fil{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:var(--ac);text-decoration:none;align-self:flex-start}
.subnav .tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
.subnav .tabs a{padding:8px 14px 10px;border-bottom:3px solid transparent;color:var(--mut);text-decoration:none;font-weight:600;white-space:nowrap;display:flex;gap:6px;align-items:center}
.subnav .tabs a:hover{color:var(--tx)}
.subnav .tabs a.on{color:var(--tx);border-bottom-color:var(--ac)}
.subnav:not(:has(.tabs)){padding-bottom:10px}
.rgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px;margin-bottom:18px}
.rcard{display:flex;gap:12px;align-items:flex-start;background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:14px 16px;text-decoration:none;color:var(--tx);transition:border-color .15s,transform .15s}
.rcard:hover{border-color:var(--ac);transform:translateY(-1px)}
.rcard .ric{width:44px;height:44px;border-radius:12px;background:var(--sun);color:var(--ac);display:flex;align-items:center;justify-content:center;flex:none}
.rcard .rtx{display:flex;flex-direction:column;gap:3px;min-width:0}
.rcard .rtx b{display:flex;gap:8px;align-items:center}
.rcard .rtx span{font-size:12px;color:var(--mut)}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.pcard{display:flex;flex-direction:column;gap:6px;background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:18px;text-decoration:none;color:var(--tx);min-height:130px}
.pcard:hover{border-color:var(--ac)}
.pcard b{font-size:18px;display:flex;gap:8px;align-items:center}
.pcard span{font-size:13px;color:var(--mut)}
.pcard .go{margin-top:auto;color:var(--ac);font-weight:600}
.side-foot{margin-top:auto;padding:12px 8px 0;border-top:1px solid #2c4e6b;font-size:12px;color:#c9d6e2}
.side-foot a{color:#fff}
main{padding:24px 28px 60px;max-width:1180px;width:100%}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.head h1{font-family:var(--disp);font-size:34px;line-height:1}
.head p{margin:4px 0 0;color:var(--mut)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px}
.grid{display:grid;gap:12px}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;text-decoration:none;color:var(--tx);display:flex;flex-direction:column;gap:2px}
.kpi b{font-family:var(--disp);font-size:34px;line-height:1.05}
.kpi span{color:var(--mut);font-size:13px}
.kpi.alerte b{color:var(--ac)}
.two{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:12px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.toolbar .grow{flex:1;min-width:180px}
input.f,select.f,textarea.f{width:100%;min-height:40px;padding:8px 10px;border:1px solid var(--bd);border-radius:10px;background:var(--card)}
textarea.f{min-height:90px;resize:vertical}
[hidden]{display:none!important}
label.l{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:600;color:var(--mut)}
label.c{display:flex;gap:8px;align-items:center;font-size:14px;min-height:32px}
label.c input{width:18px;height:18px;accent-color:var(--ac)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:38px;padding:0 14px;border-radius:10px;border:0;background:var(--ac);color:#fff;font-weight:600;cursor:pointer;text-decoration:none;white-space:nowrap}
.btn.navy{background:var(--navy)}.btn.ghost{background:var(--soft);color:var(--tx)}.btn.line{background:transparent;border:1px solid var(--bd);color:var(--tx)}
.btn.ok{background:var(--ok)}.btn.ko{background:transparent;color:var(--ko);border:1px solid var(--bd)}
.btn.sm{min-height:30px;padding:0 10px;font-size:13px;border-radius:8px}
.btn:disabled{opacity:.5}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{height:32px;padding:0 12px;border-radius:16px;border:1px solid var(--bd);background:var(--card);cursor:pointer;font-size:13px;display:inline-flex;align-items:center;gap:6px}
.chip.on{background:var(--navy);border-color:var(--navy);color:#fff}
.badge{display:inline-flex;align-items:center;font-size:11px;font-weight:600;padding:2px 8px;border-radius:9px;white-space:nowrap;background:var(--soft);color:var(--tx)}
.b-ok{background:var(--ok);color:#fff}.b-ko{background:var(--ko);color:#fff}.b-ac{background:var(--ac);color:#fff}.b-warn{background:var(--warn);color:#fff}
table.t{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--bd);border-radius:14px;overflow:hidden}
.t th{text-align:left;font-size:12px;color:var(--mut);font-weight:600;padding:10px 12px;border-bottom:1px solid var(--bd);background:var(--soft);white-space:nowrap}
.t td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
.t tr:last-child td{border-bottom:0}
.t tr.click{cursor:pointer}.t tr.click:hover td{background:var(--soft)}
.t .act{text-align:right;white-space:nowrap}
.tw{overflow-x:auto}
.mut{color:var(--mut)}.xs{font-size:12px}.small{font-size:13px}
.empty{padding:28px;text-align:center;color:var(--mut)}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%}
.list .it{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.list .it:first-child{border-top:0}
.ov{position:fixed;inset:0;background:rgba(9,20,30,.45);z-index:40;display:flex;justify-content:flex-end}
.drawer{background:var(--bg);width:min(560px,100%);height:100%;overflow:auto;padding:20px 22px 40px;box-shadow:-8px 0 30px rgba(0,0,0,.2)}
.drawer h2{font-family:var(--disp);font-size:28px;margin-bottom:12px}
.dh{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.x{background:var(--soft);border:0;border-radius:10px;width:36px;height:36px;cursor:pointer;font-size:18px}
.stack{display:flex;flex-direction:column;gap:10px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--navy);color:#fff;padding:11px 18px;border-radius:12px;font-weight:600;z-index:60;max-width:90%;text-align:center}
.skel{height:80px;border-radius:14px;background:linear-gradient(90deg,var(--soft),var(--card),var(--soft));background-size:200% 100%;animation:sk 1.2s infinite}
@keyframes sk{to{background-position:-200% 0}}
.login{max-width:420px;margin:12vh auto;padding:0 16px}
.sect{font-size:12px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:var(--mut);margin:18px 0 8px}
@media (max-width:900px){
  .layout{display:block}
  .toolbar select.f{width:100%!important}
  aside{position:sticky;height:auto;max-width:100vw;flex-direction:row;align-items:center;overflow-x:auto;padding:10px;z-index:30;gap:2px}
  .brand{padding:0 8px 0 0}.brand div{display:none}
  .nav{display:flex;gap:2px}.nav a{white-space:nowrap}
  .nav .subl{display:none}.nav a.rubl{padding:8px 10px;font-size:13px}
  .subnav{padding:10px 14px 0;top:56px}
  .side-foot{display:none}
  main{padding:16px 14px 60px}
  .two,.row2,.row3{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div id="root"><div class="login"><div class="skel"></div></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="admin.js?v=202610272240"></script>
</body>
</html>
