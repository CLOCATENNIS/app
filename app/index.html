<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CLOCA Tennis</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#102f4a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="CLOCA Tennis">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f5f2ec;--card:#ffffff;--bd:#e7e1d7;--line:#efe9df;--tx:#12304a;--mut:#5d6b78;
  --navy:#102f4a;--navy2:#1b3f5f;--ac:#b4532a;--ac-d:#8f3f1e;--peach:#e9a37f;--ok:#1f6f4a;--ko:#9b2c24;
  --sun:#fbe3d8;--soft:#f1ece3;
  --font:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;--disp:'Barlow Condensed','Arial Narrow',sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e1923;--card:#16252f;--bd:#26394a;--line:#22323f;--tx:#eef3f7;--mut:#a3b3c0;--soft:#1d2d39;--ac:#d06a3c;--ac-d:#e2865c;--ok:#2f9a68;--ko:#d0553f;
}}
:root[data-theme="dark"]{--bg:#0e1923;--card:#16252f;--bd:#26394a;--line:#22323f;--tx:#eef3f7;--mut:#a3b3c0;--soft:#1d2d39;--ac:#d06a3c;--ac-d:#e2865c;--ok:#2f9a68;--ko:#d0553f}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 var(--font);-webkit-text-size-adjust:100%}
body{padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
a{color:var(--ac)}
button{font:inherit;color:inherit}
h1,h2,h3{margin:0}
.wrap{max-width:640px;margin:0 auto}
.disp{font-family:var(--disp);font-weight:700;letter-spacing:.3px}
.mut{color:var(--mut)}
.small{font-size:13px}
.xs{font-size:12px}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.8px;text-transform:uppercase;color:var(--mut)}

/* En-têtes */
.hero{background:var(--navy);color:#fff;padding:calc(18px + env(safe-area-inset-top,0px)) 16px 16px;border-radius:0 0 24px 24px}
.hero .mut{color:#c9d6e2}
.hero-row{display:flex;align-items:center;gap:12px}
.logo{width:46px;height:46px;border-radius:50%;background:#fff;object-fit:cover;flex:none}
.hello{font-size:13px;color:#c9d6e2}
.hello-name{font-family:var(--disp);font-weight:700;font-size:26px;line-height:1.05}
.pagehead{padding:calc(18px + env(safe-area-inset-top,0px)) 16px 8px}
.pagehead h1{font-family:var(--disp);font-weight:700;font-size:32px}
.darkhead{background:var(--navy);color:#fff;padding:calc(16px + env(safe-area-inset-top,0px)) 16px 16px}
.darkhead h1{font-family:var(--disp);font-weight:700;font-size:34px;line-height:1.05}
.kicker{font-size:12px;font-weight:700;letter-spacing:1px;color:var(--peach)}
.back{display:inline-flex;align-items:center;gap:6px;min-height:44px;color:inherit;text-decoration:none;font-weight:500;background:none;border:0;padding:0;cursor:pointer}

main{padding:12px 16px 0;display:flex;flex-direction:column;gap:12px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:14px 16px}
.card.tight{padding:4px 16px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:11px 0;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.stack{display:flex;flex-direction:column;gap:3px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.tile{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:6px;text-decoration:none;color:var(--tx);text-align:left;cursor:pointer;min-height:44px}
.tile b{font-size:15px}
.tile svg{color:var(--ac)}
.stat{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px 6px;display:flex;flex-direction:column;align-items:center}
.stat b{font-family:var(--disp);font-size:28px;line-height:1.1}

.btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:48px;border-radius:14px;border:0;background:var(--ac);color:#fff;font-weight:600;font-size:15px;text-decoration:none;cursor:pointer;padding:0 16px;width:100%}
.btn.navy{background:var(--navy)}
.btn.ghost{background:var(--soft);color:var(--tx)}
.btn.line{background:transparent;border:1px solid var(--bd);color:var(--tx)}
.btn:disabled{opacity:.55}
.alert{background:var(--ac);color:#fff;border-radius:14px;padding:12px 14px;display:flex;gap:10px}
.alert.urgent{background:#a3261c}
.alert a{color:#fff;font-weight:700}

.badge{display:inline-flex;align-items:center;font-size:12px;font-weight:600;padding:3px 10px;border-radius:10px;white-space:nowrap}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;flex:none}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{height:36px;padding:0 14px;border-radius:18px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font-size:13px;font-weight:500;flex:none;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.chip.on{background:var(--navy);border-color:var(--navy);color:#fff;font-weight:600}
.hero .chip{background:transparent;border-color:#2c4e6b;color:#fff}
.hero .chip.on{background:#fff;color:var(--navy);border-color:#fff}
.seg{display:flex;gap:6px;background:var(--soft);border-radius:12px;padding:4px}
.seg button{flex:1;height:38px;border:0;border-radius:9px;background:transparent;color:var(--mut);font-size:14px;cursor:pointer}
.seg button.on{background:var(--card);color:var(--tx);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.06)}
.darkhead .seg{background:var(--navy2)}
.darkhead .seg button{color:#dbe4ec}
.darkhead .seg button.on{background:#fff;color:var(--navy)}

/* Rendez-vous et agenda */
.rdv{display:flex;gap:14px;align-items:center}
.datebox{width:62px;height:62px;border-radius:14px;background:var(--navy);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;flex:none}
.datebox span{font-size:11px;color:#c9d6e2;text-transform:uppercase}
.datebox b{font-family:var(--disp);font-size:28px;line-height:1}
.ev{display:flex;gap:12px;background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px 14px;text-decoration:none;color:var(--tx)}
.ev .bar{width:4px;border-radius:2px;flex:none}
.ev.off{opacity:.65}
.ev.off .t{text-decoration:line-through}
.ev.possible{border-style:dashed;background:transparent}
.dayhead{font-size:13px;font-weight:600;color:var(--mut);margin:4px 2px -4px}

/* Classement */
.podium{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;align-items:end;padding-top:16px;padding-bottom:0}
.podium .p{display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center}
.podium .p b{font-size:14px}
.podium .blk{width:100%;border-radius:10px 10px 0 0;display:flex;align-items:center;justify-content:center;font-family:var(--disp);font-weight:700;font-size:30px}
.rk{display:grid;grid-template-columns:34px minmax(0,1fr) 54px 54px;align-items:center;padding:11px 0;border-top:1px solid var(--line);font-size:15px}
.rk.h{font-size:12px;font-weight:600;color:var(--mut);border-top:0}
.rk.me{background:var(--sun);margin:2px -8px;padding:11px 8px;border-radius:10px;border-top:0;font-weight:700;color:#12304a}
.rk .n{text-align:right}
.rk a{color:inherit;text-decoration:none}

/* Formulaires */
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:600}
input.f,select.f,textarea.f{width:100%;min-height:48px;padding:10px 12px;border:1px solid var(--bd);border-radius:12px;background:var(--card);color:var(--tx);font:16px var(--font)}
textarea.f{min-height:80px}
.check{display:flex;gap:10px;align-items:flex-start;font-size:14px;min-height:44px;padding:6px 0}
.check input{width:20px;height:20px;margin-top:1px;accent-color:var(--ac);flex:none}
.pick{display:flex;align-items:center;gap:12px;min-height:50px;padding:0 12px;border-radius:12px;border:1px solid var(--bd);font-weight:600;cursor:pointer}
button.pick{width:100%;background:var(--card);color:var(--tx);font:inherit;font-weight:600;text-align:left}
.pick.on{border:2px solid var(--ac);background:var(--sun);color:#12304a}

.clamp2{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.empty{text-align:center;padding:22px 10px;color:var(--mut)}
.skel{height:64px;border-radius:14px;background:linear-gradient(90deg,var(--soft),var(--card),var(--soft));background-size:200% 100%;animation:sk 1.2s infinite}
@keyframes sk{to{background-position:-200% 0}}
.modal-f{position:fixed;inset:0;z-index:60;background:rgba(10,25,40,.55);display:flex;align-items:flex-end;justify-content:center;padding:12px;padding-bottom:calc(12px + env(safe-area-inset-bottom,0px))}
@media (min-width:600px){.modal-f{align-items:center}}
.modal{position:relative;background:var(--card);color:var(--tx);border-radius:22px;padding:22px 18px 16px;width:100%;max-width:440px;max-height:calc(100vh - 40px);overflow:auto;box-shadow:0 20px 50px rgba(0,0,0,.3)}
.modal-x{position:absolute;top:10px;right:10px;width:36px;height:36px;border-radius:50%;border:0;background:var(--soft);color:var(--tx);font-size:22px;line-height:1;cursor:pointer}
.guide-pts{display:flex;gap:5px;justify-content:center}
.guide-pts span{width:8px;height:8px;border-radius:4px;background:var(--bd)}
.guide-pts span.fait{background:var(--peach)}
.guide-pts span.on{width:22px;background:var(--ac)}
.carou{position:relative;border-radius:12px;overflow:hidden;background:var(--soft)}
.car-l{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.car-l::-webkit-scrollbar{display:none}
.car-l img{flex:0 0 100%;width:100%;height:260px;object-fit:cover;scroll-snap-align:center}
.car-n{position:absolute;top:8px;right:8px;background:rgba(16,47,74,.75);color:#fff;font-size:12px;font-weight:600;padding:2px 8px;border-radius:10px}
.car-dots{position:absolute;bottom:8px;left:0;right:0;display:flex;justify-content:center;gap:5px}
.car-dots span{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.55)}
.car-dots span.on{background:#fff}
.car-b{position:absolute;top:50%;transform:translateY(-50%);width:34px;height:34px;border-radius:50%;border:0;background:rgba(255,255,255,.85);color:#102f4a;font-size:22px;line-height:1;cursor:pointer;display:none}
.car-b.g{left:8px}.car-b.d{right:8px}
@media (hover:hover){.carou:hover .car-b{display:block}}
.an-ph{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.an-ph .th{position:relative;width:76px;height:76px}
.an-ph .th img{width:100%;height:100%;object-fit:cover;border-radius:10px}
.an-ph .th button{position:absolute;top:-6px;right:-6px;width:24px;height:24px;border-radius:50%;border:0;background:var(--navy);color:#fff;font-size:15px;line-height:1;cursor:pointer}
.cases{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:14px}
.cases button{display:flex;align-items:center;gap:8px;min-height:52px;padding:10px 12px;border-radius:14px;border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.08);color:#fff;font:inherit;font-weight:600;font-size:14px;text-align:left;cursor:pointer}
.cases button span{flex:1}
.cases button b{background:var(--ac);color:#fff;border-radius:10px;font-size:12px;padding:1px 8px}
.cases button b:empty{display:none}
.cases button.on{background:#fff;color:var(--navy);border-color:#fff}
.cases button:last-child:nth-child(odd){grid-column:span 2}
.tuiles{display:grid;gap:8px;margin:0 0 10px}.tuiles.t3{grid-template-columns:repeat(3,minmax(0,1fr))}.tuiles.tp{grid-template-columns:repeat(auto-fill,minmax(64px,1fr))}
.tuiles button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:56px;padding:8px 6px;border-radius:14px;border:1px solid var(--line);background:#fff;color:var(--navy);font:inherit;cursor:pointer}
.tuiles button b{font-size:16px}.tuiles.tp button b{font-size:20px;line-height:1}.tuiles button span{font-size:12px;color:var(--mut)}
.resa{display:flex;gap:10px;align-items:center;justify-content:space-between;border-radius:12px;padding:10px 12px;font-size:13px;line-height:1.4}.resa.ok{background:#e3f3e8;color:#1d5a32;justify-content:flex-start}.resa.att{background:#fbeee6;color:#7a3a1c}
.tuiles button.on{background:var(--navy);border-color:var(--navy);color:#fff}.tuiles button.on span{color:#c9d6e2}
.cloche{position:relative;display:flex;align-items:center;justify-content:center;width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.12);flex:none}
.cloche .nb{position:absolute;top:2px;right:0;min-width:19px;height:19px;padding:0 5px;border-radius:10px;background:var(--ac);color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;border:2px solid var(--navy)}
.pastille{position:absolute;top:6px;left:calc(50% + 8px);width:9px;height:9px;border-radius:50%;background:var(--ac)}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--navy);color:#fff;padding:12px 18px;border-radius:12px;font-weight:600;z-index:30;max-width:90%;text-align:center}
.partners{text-align:center;margin:14px 0 4px}
.partners a{display:inline-block;font-size:13px;color:var(--mut);text-decoration:none;border:1px solid var(--bd);padding:7px 14px;border-radius:16px;background:var(--card);margin:4px}

/* Barre de navigation */
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--bd);padding:0 6px env(safe-area-inset-bottom,0px);z-index:20}
nav.tabs .in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(var(--n,5),minmax(0,1fr));height:72px}
nav.tabs a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;text-decoration:none;color:var(--mut);font-size:11px;font-weight:500}
nav.tabs a.on{color:var(--ac);font-weight:600}
.sr{position:absolute;left:-9999px}
@media (min-width:700px){.hero,.darkhead{border-radius:0 0 24px 24px}}

/* ====== Écrans larges : tablette (768 px et +) et ordinateur (1024 px et +) ======
   Tout ce qui suit ne s'applique pas sous 768 px : le téléphone garde son affichage d'origine. */
nav.tabs .side-brand,nav.tabs .side-foot{display:none}
.ag-jour{display:contents}
@media (min-width:768px){
  #app.wrap{max-width:none}
  .wrap{max-width:880px}
  .hero>.wrap,.darkhead>.wrap{padding:0 8px}
  .hero{padding:calc(24px + env(safe-area-inset-top,0px)) 24px 20px}
  .darkhead{padding:calc(22px + env(safe-area-inset-top,0px)) 24px 22px}
  .pagehead{padding:calc(24px + env(safe-area-inset-top,0px)) 32px 8px}
  main{max-width:880px;margin:0 auto;padding:18px 24px 0;gap:14px}
  nav.tabs .in{max-width:720px}
  .chips{flex-wrap:wrap;overflow:visible}
  .cases{grid-template-columns:repeat(4,minmax(0,1fr))}
  .cases button:last-child:nth-child(odd){grid-column:auto}
  .seg{max-width:620px}
  .podium{max-width:620px;margin-left:auto;margin-right:auto;width:100%}
  /* Accueil en deux colonnes */
  .dk-home{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px;align-items:start}
  .dk-top{grid-column:1/-1;display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}
  .dk-col{display:flex;flex-direction:column;gap:14px;min-width:0}
  .dk-col #presence:empty{display:none}
  /* Listes de cartes en grille : les titres, filtres et blocs larges prennent toute la ligne */
  body:is([data-page="agenda"],[data-page="inscriptions"],[data-page="gestion"],[data-page="arena"],[data-page="coach"],[data-page="cordeur"],[data-page="bureau"],[data-page="groupe"]) main,
  #club-main,#club-ag,#bur-main,#coach-main,#arena-main{display:grid!important;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px;align-items:start}
  body:is([data-page="agenda"],[data-page="inscriptions"],[data-page="gestion"],[data-page="arena"],[data-page="coach"],[data-page="cordeur"],[data-page="bureau"],[data-page="groupe"]) main>:not(.card,.ev,.tile,.ag-jour),
  :is(#club-main,#club-ag,#bur-main,#coach-main,#arena-main)>:not(.card,.ev,.tile,.ag-jour),
  body main>.card.empty,:is(#club-main,#club-ag,#bur-main,#coach-main,#arena-main)>.card.empty{grid-column:1/-1}
  .dayhead{margin:8px 2px 0}
  .ag-jour{display:flex;flex-direction:column;gap:10px;min-width:0}
  .ag-jour>.dayhead{margin:4px 2px 0}
  /* Pages de lecture et formulaires : colonne confortable, pas trop large */
  body:is([data-page="actu"],[data-page="aide"],[data-page="message"],[data-page="messages"],[data-page="saisie"],[data-page="fiche"]) main{max-width:760px}
  .modal{max-width:520px}
}
@media (min-width:1024px){
  :root{--side:248px}
  body{padding-bottom:0;padding-left:var(--side)}
  /* Navigation : barre latérale fixe */
  nav.tabs{top:0;bottom:0;right:auto;width:var(--side);border-top:0;background:var(--navy);padding:20px 14px calc(16px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px;overflow-y:auto}
  nav.tabs .side-brand{display:block}
  nav.tabs .side-brand a{display:flex;flex-direction:row;justify-content:flex-start;align-items:center;font-size:inherit;gap:10px;padding:2px 8px 14px;border-bottom:1px solid #2c4e6b;color:#fff;text-decoration:none}
  nav.tabs .side-brand img{width:42px;height:42px;border-radius:50%;background:#fff;object-fit:cover;flex:none}
  nav.tabs .side-brand b{display:block;font-family:var(--disp);font-size:24px;line-height:1;white-space:nowrap}
  nav.tabs .side-brand small{display:block;font-size:11px;letter-spacing:.8px;color:#c9d6e2;margin-top:2px}
  nav.tabs .in{max-width:none;margin:0;display:flex;flex-direction:column;gap:4px;height:auto}
  nav.tabs .in a{flex-direction:row;justify-content:flex-start;gap:12px;padding:12px 12px;border-radius:12px;color:#dbe4ec;font-size:15px;font-weight:500;min-height:48px}
  nav.tabs .in a:hover{background:var(--navy2);color:#fff}
  nav.tabs .in a.on{background:#fff;color:var(--navy);font-weight:600}
  nav.tabs .pastille{top:12px;left:30px;border:2px solid var(--navy)}
  nav.tabs .side-foot{display:flex;flex-direction:column;gap:6px;margin-top:auto;padding:12px 8px 0;border-top:1px solid #2c4e6b;font-size:12px}
  nav.tabs .side-foot a{display:block;font-size:12px;color:#c9d6e2;text-decoration:none;overflow-wrap:anywhere}
  nav.tabs .side-foot a:hover{color:#fff;text-decoration:underline}
  .toast{bottom:28px;left:calc(50% + var(--side) / 2)}
  /* Conteneur principal */
  .wrap{max-width:1240px}
  .hero{padding:28px 32px 26px}
  .darkhead{padding:28px 32px 28px}
  .hero,.darkhead{border-radius:0 0 28px 28px}
  .hello-name{font-size:34px}
  .logo{width:56px;height:56px}
  .darkhead h1{font-size:46px}
  .pagehead{padding:34px 40px 10px}
  .pagehead h1{font-size:44px}
  main{max-width:1240px;padding:26px 40px 56px;gap:16px}
  .dk-home{grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:18px}
  .dk-home .grid2 .tile{min-height:120px}
  body:is([data-page="agenda"],[data-page="inscriptions"],[data-page="gestion"],[data-page="arena"],[data-page="coach"],[data-page="cordeur"],[data-page="bureau"],[data-page="groupe"]) main,
  #club-main,#club-ag,#bur-main,#coach-main,#arena-main{grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:16px}
  .grid2:has(>.stat,>section.card){grid-template-columns:repeat(4,minmax(0,1fr))}
  /* Profil et fiche événement : cartes réparties sur deux colonnes */
  body:is([data-page="profil"],[data-page="evenement"],[data-page="cordage"],[data-page="double"]) main{display:block;columns:2;column-gap:18px}
  body:is([data-page="profil"],[data-page="evenement"],[data-page="cordage"],[data-page="double"]) main>*{break-inside:avoid;margin-bottom:18px}
  body[data-page="profil"]:not(:has(.card.tight)) main{columns:1;max-width:560px}
  /* Classement CLOC'ARENA : podium à gauche, tableau à droite */
  #arena-main:has(>.podium){grid-template-columns:minmax(0,1fr) minmax(0,1.5fr)}
  #arena-main:has(>.podium)>.podium,#arena-main:has(>.podium)>.card{grid-column:auto}
  #arena-main>.podium{position:sticky;top:20px;max-width:none}
  .car-l img{height:380px}
  .modal{max-width:560px}
}
@media (min-width:1280px){.dk-home{grid-template-columns:minmax(0,1.45fr) minmax(0,1fr)}}
@media (min-width:1024px) and (hover:hover){
  .tile,a.card,a.ev,.pick,.chip,.btn{transition:border-color .15s,transform .15s,box-shadow .15s,filter .15s}
  .tile:hover,a.card:hover,a.ev:hover{border-color:var(--ac);transform:translateY(-1px);box-shadow:0 6px 18px rgba(16,47,74,.08)}
  .btn:hover{filter:brightness(1.07)}
  .chip:hover{border-color:var(--navy)}
}

/* Fêtes du club (Noël…) */
.fete-carte{display:flex;gap:12px;align-items:center;text-decoration:none;color:var(--tx);border:2px solid #b8862b;background:linear-gradient(135deg,var(--card),var(--sun))}
.fete-carte img{width:74px;height:104px;object-fit:cover;border-radius:10px;flex:none;box-shadow:0 4px 12px rgba(0,0,0,.18)}
.fete-head{background:linear-gradient(160deg,#0f3b2a,#14523a);border-radius:0 0 24px 24px}
.fete-affiche{display:block;width:100%;padding:0;border:0;background:none;cursor:zoom-in;border-radius:18px;overflow:hidden;box-shadow:0 10px 30px rgba(15,59,42,.28)}
.fete-affiche img{display:block;width:100%;height:auto}
.fete-ok{border:2px solid var(--ok);background:color-mix(in srgb,var(--ok) 9%,var(--card))}
.lot{display:flex;gap:12px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.lot:first-of-type{border-top:0}
.lot img{width:48px;height:48px;border-radius:10px;object-fit:cover;flex:none}
.lot-n{width:36px;height:36px;border-radius:50%;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:center;font-family:var(--disp);font-weight:700;font-size:18px;flex:none}
.stepper{display:flex;gap:10px;align-items:center}
.stepper .btn{width:56px;flex:none;font-size:24px;padding:0}
main.wrap{max-width:640px;margin:0 auto}
/* Discussions */
.dfil{display:flex;flex-direction:column;gap:4px;padding:6px 0 calc(150px + env(safe-area-inset-bottom,0px))}
.dmsg{max-width:84%;padding:7px 11px 6px;border-radius:16px;background:var(--card);border:1px solid var(--bd);align-self:flex-start;white-space:pre-wrap;overflow-wrap:anywhere;font-size:15px;line-height:1.38;margin-top:6px}
.dmsg.suite{margin-top:0}
.dmsg.moi{align-self:flex-end;background:var(--navy);border-color:var(--navy);color:#fff}
.dmsg[data-dret]{cursor:pointer}
.dmsg.retire{opacity:.6}
.dmsg .qui{display:block;font-size:12px;font-weight:700;color:var(--ac);margin-bottom:1px;white-space:normal}
.dmsg .qui .club{font-size:10px;font-weight:700;background:var(--ac);color:#fff;border-radius:6px;padding:1px 5px;margin-left:4px;vertical-align:1px}
.dmsg .h{font-size:11px;opacity:.6;margin-left:10px;float:right;margin-top:5px;white-space:nowrap}
.djour{align-self:center;font-size:12px;color:var(--mut);background:var(--soft);padding:3px 12px;border-radius:10px;margin:10px 0 4px}
.dcompo{position:fixed;left:0;right:0;bottom:calc(72px + env(safe-area-inset-bottom,0px));background:var(--card);border-top:1px solid var(--bd);padding:8px 12px;z-index:19;display:flex;gap:8px;align-items:flex-end;min-height:60px}
.dcompo textarea{flex:1;resize:none;border:1px solid var(--bd);border-radius:22px;padding:11px 16px;font:inherit;font-size:16px;line-height:1.3;background:var(--bg);color:var(--tx);max-height:140px;min-height:44px}
.dcompo textarea:focus{outline:2px solid var(--ac);outline-offset:-1px}
.dcompo button{width:44px;height:44px;border-radius:50%;border:0;background:var(--ac);flex:none;display:flex;align-items:center;justify-content:center;cursor:pointer}
.dcompo button:disabled{opacity:.5}
@media (min-width:768px){.dcompo{padding:10px 24px}.dmsg{max-width:70%}}
@media (min-width:1024px){.dcompo{left:var(--side);bottom:0}.dfil{padding-bottom:110px}}
